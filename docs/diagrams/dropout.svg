<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="520" viewBox="0 0 680 520" role="img">
<title>Dropout recovery on the satellite ring</title>
<desc>One satellite (sat 2) has dropped. Its two pair-mask edges to ring neighbors are orphaned. Sat 1 and sat 3 disclose the orphaned masks to the cluster head. By the asymmetric disclosure rule, sat 2's self-mask b is NOT reconstructed; honest peers refuse to release Shamir shares of b for dropped sats.</desc>

<style>
  .t  { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif; font-size: 14px; font-weight: 400; fill: #2C2C2A; }
  .ts { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif; font-size: 12px; font-weight: 400; fill: #5F5E5A; }
  .th { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif; font-size: 14px; font-weight: 500; fill: #2C2C2A; }
  .leader { stroke: #B4B2A9; stroke-width: 0.5; stroke-dasharray: 2 2; fill: none; }

  .c-blue  > rect, .c-blue  > ellipse, .c-blue  > circle { fill: #E6F1FB; stroke: #185FA5; }
  .c-blue  > text.th, .c-blue  > text.t  { fill: #0C447C; }
  .c-blue  > text.ts                     { fill: #185FA5; }

  .c-amber > rect, .c-amber > ellipse, .c-amber > circle { fill: #FAEEDA; stroke: #BA7517; }
  .c-amber > text.th, .c-amber > text.t  { fill: #633806; }
  .c-amber > text.ts                     { fill: #854F0B; }

  .c-teal  > rect, .c-teal  > ellipse, .c-teal  > circle { fill: #E1F5EE; stroke: #0F6E56; }
  .c-teal  > text.th, .c-teal  > text.t  { fill: #085041; }
  .c-teal  > text.ts                     { fill: #0F6E56; }

  .c-gray  > rect, .c-gray  > ellipse, .c-gray  > circle { fill: #F1EFE8; stroke: #5F5E5A; }
  .c-gray  > text.th, .c-gray  > text.t  { fill: #2C2C2A; }
  .c-gray  > text.ts                     { fill: #5F5E5A; }

  .c-coral > rect, .c-coral > ellipse, .c-coral > circle { fill: #FAECE7; stroke: #993C1D; }
  .c-coral > text.th, .c-coral > text.t  { fill: #4A1B0C; }
  .c-coral > text.ts                     { fill: #993C1D; }
</style>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
  <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<line x1="240" y1="100" x2="339" y2="141" stroke="#1D9E75" stroke-width="1.2"/>
<line x1="339" y1="141" x2="380" y2="240" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="380" y1="240" x2="339" y2="339" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="339" y1="339" x2="240" y2="380" stroke="#1D9E75" stroke-width="1.2"/>
<line x1="240" y1="380" x2="141" y2="339" stroke="#1D9E75" stroke-width="1.2"/>
<line x1="141" y1="339" x2="100" y2="240" stroke="#1D9E75" stroke-width="1.2"/>
<line x1="100" y1="240" x2="141" y2="141" stroke="#1D9E75" stroke-width="1.2"/>
<line x1="141" y1="141" x2="240" y2="100" stroke="#1D9E75" stroke-width="1.2"/>

<g transform="translate(240,100)" class="c-blue"><rect x="-15" y="-3" width="6" height="6" stroke-width="0.5"/><rect x="-7" y="-5" width="14" height="10" rx="1" stroke-width="0.5"/><rect x="9" y="-3" width="6" height="6" stroke-width="0.5"/></g>
<g transform="translate(339,141)" class="c-blue"><rect x="-15" y="-3" width="6" height="6" stroke-width="0.5"/><rect x="-7" y="-5" width="14" height="10" rx="1" stroke-width="0.5"/><rect x="9" y="-3" width="6" height="6" stroke-width="0.5"/></g>

<g transform="translate(380,240)" opacity="0.55">
<rect x="-15" y="-3" width="6" height="6" stroke="#D85A30" stroke-width="0.5" stroke-dasharray="2 1.5" fill="none"/>
<rect x="-7" y="-5" width="14" height="10" rx="1" stroke="#D85A30" stroke-width="0.5" stroke-dasharray="2 1.5" fill="none"/>
<rect x="9" y="-3" width="6" height="6" stroke="#D85A30" stroke-width="0.5" stroke-dasharray="2 1.5" fill="none"/>
</g>

<g transform="translate(339,339)" class="c-blue"><rect x="-15" y="-3" width="6" height="6" stroke-width="0.5"/><rect x="-7" y="-5" width="14" height="10" rx="1" stroke-width="0.5"/><rect x="9" y="-3" width="6" height="6" stroke-width="0.5"/></g>
<g transform="translate(240,380)" class="c-amber"><rect x="-15" y="-3" width="6" height="6" stroke-width="0.5"/><rect x="-8" y="-6" width="16" height="12" rx="1" stroke-width="1"/><rect x="9" y="-3" width="6" height="6" stroke-width="0.5"/></g>
<g transform="translate(141,339)" class="c-blue"><rect x="-15" y="-3" width="6" height="6" stroke-width="0.5"/><rect x="-7" y="-5" width="14" height="10" rx="1" stroke-width="0.5"/><rect x="9" y="-3" width="6" height="6" stroke-width="0.5"/></g>
<g transform="translate(100,240)" class="c-blue"><rect x="-15" y="-3" width="6" height="6" stroke-width="0.5"/><rect x="-7" y="-5" width="14" height="10" rx="1" stroke-width="0.5"/><rect x="9" y="-3" width="6" height="6" stroke-width="0.5"/></g>
<g transform="translate(141,141)" class="c-blue"><rect x="-15" y="-3" width="6" height="6" stroke-width="0.5"/><rect x="-7" y="-5" width="14" height="10" rx="1" stroke-width="0.5"/><rect x="9" y="-3" width="6" height="6" stroke-width="0.5"/></g>

<text class="ts" x="270" y="384">cluster head</text>
<text class="ts" x="380" y="266" text-anchor="middle" fill="#993C1D">dropped</text>

<line x1="240" y1="395" x2="240" y2="450" stroke="#BA7517" stroke-width="2" marker-end="url(#arrow)"/>
<text class="ts" x="252" y="427">Σ Δᵢ</text>

<g transform="translate(240,460)" class="c-gray"><ellipse cx="0" cy="0" rx="12" ry="4" stroke-width="0.5"/><line x1="0" y1="3" x2="0" y2="10" stroke="#5F5E5A" stroke-width="1"/><rect x="-14" y="10" width="28" height="6" rx="1" stroke-width="0.5"/></g>
<text class="ts" x="240" y="488" text-anchor="middle">ground station</text>

<g transform="translate(440,130)" class="c-coral"><rect width="220" height="74" rx="8" stroke-width="0.5"/><text class="th" x="110" y="26" text-anchor="middle">Sat 2 dropped</text><text class="ts" x="110" y="46" text-anchor="middle">masked update missing</text><text class="ts" x="110" y="62" text-anchor="middle">two pair masks orphaned</text></g>

<g transform="translate(440,240)" class="c-teal"><rect width="220" height="74" rx="8" stroke-width="0.5"/><text class="th" x="110" y="26" text-anchor="middle">Neighbors disclose</text><text class="ts" x="110" y="46" text-anchor="middle">sats 1 and 3 reveal</text><text class="ts" x="110" y="62" text-anchor="middle">the orphaned masks</text></g>

<g transform="translate(440,350)" class="c-amber"><rect width="220" height="74" rx="8" stroke-width="0.5"/><text class="th" x="110" y="26" text-anchor="middle">Asymmetric rule</text><text class="ts" x="110" y="46" text-anchor="middle">b₂ stays hidden</text><text class="ts" x="110" y="62" text-anchor="middle">shares not released</text></g>
</svg>
