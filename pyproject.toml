[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hfl-sipa"
version = "0.1.0"
description = "Hierarchical federated learning with secure intra-plane aggregation for LEO satellite constellations"
readme = "README.md"
requires-python = ">=3.10"
keywords = [
    "federated-learning",
    "secure-aggregation",
    "satellite",
    "leo-constellation",
    "privacy",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "numpy>=1.24",
    "cryptography>=41.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.urls]
# Replace <your-username> before publishing.
Repository = "https://github.com/<your-username>/hfl-sipa"
Issues = "https://github.com/<your-username>/hfl-sipa/issues"

[tool.setuptools.packages.find]
include = ["hfl_sipa*"]
exclude = ["tests*", "examples*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
